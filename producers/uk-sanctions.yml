# The UK sanctions list, from the FCDO's UK Sanctions List (the single UK list since OFSI's
# Consolidated List closed; its old download now answers "Public access is not permitted").
#
# In its OWN file, deliberately: a realm file that fails to parse is dropped WHOLE by the loader,
# and this producer reads a large third-party CSV whose shape is outside our control. Keeping it
# separate means an upstream format change costs the sanctions check, never the Companies House
# producers beside it.
#
# Measured 2026-11-25: about 50 MB, 58,918 rows, no key required, and the file opens with a
# one-line "Report Date: <date>" banner ABOVE the real header — hence headerRow: 2. Reading the
# banner as the schema would silently give every column the wrong name. A designation spans
# several rows (aliases, addresses); rows collapse to one entry per `Unique ID`, which every row
# carries — the OFSI Group ID is blank on 3,769 rows.
#
# This producer is a NAME LOOKUP and nothing more. The list carries no company number and no
# Companies House person number, so there is no identifier to join on — only names, and dates of
# birth where the list publishes them. Everything it returns is a POSSIBLE match for a human to
# check, which is why the surname is the fetch key and the view that reads it says so loudly.

- name: sanctionsBySurname
  kind: tabular
  url: "https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.csv"
  format: csv
  headerRow: 2
  keyColumn: "Name 6"
  keyMatch: ci
  keyAs: surnameQueried
  project:
    uniqueId: "Unique ID"
    groupId: "OFSI Group ID"
    surname: "Name 6"
    forename1: "Name 1"
    forename2: "Name 2"
    title: "Title"
    groupType: "Designation Type"
    regime: "Regime Name"
    dateOfBirth: "D.O.B"
    nationality: "Nationality(/ies)"
    countryOfBirth: "Country of birth"
    position: "Position"
    statementOfReasons: "UK Statement of Reasons"
    listedOn: "Date Designated"
    lastUpdated: "Last Updated"
  # The file changes when the FCDO republishes it, which is often but not continuously.
  fileCacheSeconds: 21600
  maxRowsPerKey: 200
  # Applied while the file is read, before a row counts against maxRowsPerKey: "is this surname
  # an individual's designation" keeps aliases of entities and ships from crowding out the cap.
  pushdown:
    - { property: groupType, type: string, ops: [EQUALS, IN] }
